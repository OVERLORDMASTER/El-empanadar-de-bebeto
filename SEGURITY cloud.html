<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión Seguro</title>
    <style>
        /* Estilos CSS modernos y limpios */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f1f5f9;
            overflow: hidden;
        }

        /* Contenedor del Login */
        .login-container {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
            transition: all 0.5s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h2 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: #0ea5e9;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Contenedores de mensajes */
        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
            text-align: center;
        }

        .message.error {
            background-color: #ef444422;
            color: #f87171;
            border: 1px solid #ef444455;
            display: block;
        }

        .message.success {
            background-color: #22c55e22;
            color: #4ade80;
            border: 1px solid #22c55e55;
            display: block;
        }

        .shield-icon {
            display: inline-block;
            width: 50px;
            height: 50px;
            background-color: #38bdf822;
            border-radius: 50%;
            line-height: 50px;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        /* NUEVA VENTANA: Panel de Bienvenida Protegido */
        .dashboard-container {
            background-color: #1e293b;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 500px;
            border: 1px solid #334155;
            text-align: center;
            display: none; /* Oculto al principio */
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .dashboard-container.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .welcome-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            animation: bounce 2s infinite;
        }

        .dashboard-container h1 {
            color: #4ade80;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .dashboard-container p {
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn-logout {
            padding: 0.75rem 2rem;
            background-color: #f87171;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn-logout:hover {
            background-color: #ef4444;
            color: #fff;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Clase para ocultar elementos con suavidad */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="login-container" id="loginBox">
        <div class="login-header">
            <div class="shield-icon">🛡️</div>
            <h2>Acceso Seguro</h2>
            <p>Protegido por Cloudflare</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" required placeholder="Escribe tu usuario">
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">Iniciar Sesión</button>
        </form>

        <div id="responseMessage" class="message"></div>
    </div>

    <div class="dashboard-container" id="dashboardBox">
        <div class="welcome-icon">🎉</div>
        <h1>¡Acceso Autorizado!</h1>
        <p>Bienvenido al sistema seguro, <strong id="userDisplay" style="color: #38bdf8;"></strong>.<br> Has iniciado sesión exitosamente conectándote a Cloudflare Workers y tu base de datos KV.</p>
        <button class="btn-logout" id="btnLogout">Cerrar Sesión</button>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN: TU URL DE CLOUDFLARE WORKER
        // ==========================================
        const WORKER_URL = "https://login-worker.benjaminandresperaza.workers.dev";
        
        const loginBox = document.getElementById('loginBox');
        const loginForm = document.getElementById('loginForm');
        const responseMessage = document.getElementById('responseMessage');
        const btnSubmit = document.getElementById('btnSubmit');

        // Elementos de la nueva ventana
        const dashboardBox = document.getElementById('dashboardBox');
        const userDisplay = document.getElementById('userDisplay');
        const btnLogout = document.getElementById('btnLogout');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue

            // Limpiar mensajes previos
            responseMessage.className = "message";
            responseMessage.textContent = "";

            // Obtener los datos del formulario
            const usuario = document.getElementById('usuario').value;
            const contrasena = document.getElementById('contrasena').value;

            // Deshabilitar botón mientras procesa
            btnSubmit.textContent = "Verificando...";
            btnSubmit.disabled = true;

            try {
                // Enviar la petición de forma segura al Worker de Cloudflare
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ usuario, contrasena })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Login exitoso
                    responseMessage.className = "message success";
                    responseMessage.textContent = data.mensaje;
                    
                    // Esperar 1 segundo para mostrar el mensaje de éxito y luego hacer la transición
                    setTimeout(() => {
                        // 1. Ocultar la caja de login
                        loginBox.classList.add('hidden');
                        
                        // 2. Mostrar el nombre de usuario en la nueva ventana
                        userDisplay.textContent = usuario;

                        // 3. Mostrar la ventana protegida con animación
                        dashboardBox.classList.add('show');
                    }, 1000);

                } else {
                    // Error devuelto por el servidor (usuario o clave incorrecta)
                    responseMessage.className = "message error";
                    responseMessage.textContent = data.error || "Acceso denegado";
                }

            } catch (error) {
                // Error de conexión o de red
                responseMessage.className = "message error";
                responseMessage.textContent = "Error de conexión. Asegúrate de configurar la URL correcta.";
            } finally {
                // Restaurar botón
                btnSubmit.textContent = "Iniciar Sesión";
                btnSubmit.disabled = false;
            }
        });

        // Evento para Cerrar Sesión y volver al Login
        btnLogout.addEventListener('click', () => {
            // Ocultar la ventana de bienvenida
            dashboardBox.classList.remove('show');
            
            // Esperar a que termine la animación de salida para resetear el formulario
            setTimeout(() => {
                loginForm.reset();
                responseMessage.className = "message";
                responseMessage.textContent = "";
                loginBox.classList.remove('hidden');
            }, 300);
        });
    </script>
</body>
</html>
